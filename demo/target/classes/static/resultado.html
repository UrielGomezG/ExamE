<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado del Registro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #00eaff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1a1a1a;
            border: 2px solid #00eaff;
            border-radius: 10px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 20px rgba(0, 234, 255, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00eaff;
            text-shadow: 0 0 10px rgba(0, 234, 255, 0.5);
        }

        .dato {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #0a0a0a;
            border-left: 3px solid #00eaff;
            border-radius: 5px;
        }

        .dato label {
            display: block;
            font-weight: bold;
            color: #00eaff;
            margin-bottom: 5px;
        }

        .dato p {
            color: #ffffff;
            word-break: break-all;
            padding-left: 10px;
        }

        .botones {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            background-color: #00eaff;
            color: #0a0a0a;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 234, 255, 0.5);
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✓ Registro Completado</h1>
        
        <div class="dato">
            <label>Nombre:</label>
            <p th:text="${Nombre}"></p>
        </div>

        <div class="dato">
            <label>Apellido Paterno:</label>
            <p th:text="${ApellidoP}"></p>
        </div>

        <div class="dato">
            <label>Apellido Materno:</label>
            <p th:text="${ApellidoM}"></p>
        </div>

        <div class="dato">
            <label>Correo:</label>
            <p th:text="${Correo}"></p>
        </div>

        <div class="dato">
            <label>Contraseña:</label>
            <p th:text="${Contraseña}"></p>
        </div>

        <div class="botones">
            <button onclick="location.href='/'">Volver al Inicio</button>
        </div>
    </div>
</body>
</html>
